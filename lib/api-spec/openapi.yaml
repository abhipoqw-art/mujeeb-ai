openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: images
    description: Image generation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /images/generate:
    post:
      operationId: generateImage
      tags: [images]
      summary: Generate an image
      description: Generates an image through the configured OpenRouter image model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageGenerationInput"
      responses:
        "200":
          description: Generated image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationResult"
        "400":
          description: Invalid image generation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Image provider error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ImageGenerationInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 4000
        aspectRatio:
          type: string
          enum: ["1:1", "4:5", "16:9"]
        style:
          type: string
          maxLength: 80
        useReference:
          type: boolean
        model:
          type: string
          maxLength: 160
      required:
        - prompt
    ImageGenerationResult:
      type: object
      properties:
        imageDataUrl:
          type: string
        model:
          type: string
        created:
          type: integer
        cost:
          type: ["number", "null"]
      required:
        - imageDataUrl
        - model
        - created
        - cost
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

